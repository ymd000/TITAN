[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titan"
version = "0.1.0"
description = "TITAN"
readme = "README.md"
license = { text = "CC-BY-NC-ND 4.0" }
authors = [
    { name = "TD,SJW,AHS,RJC" },
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.1",
    "torchvision>=0.15.2",
    "timm>=1.0.3",
    "einops>=0.6.1",
    "einops-exts>=0.0.4",
    "tqdm>=4.66.6",
    "h5py>=3.8.0",
    "transformers>=4.46.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.5.2",
    "numpy<2.0",
]

[project.urls]
Homepage = "https://github.com/mahmoodlab/TITAN"

[tool.hatch.build.targets.wheel]
packages = ["titan"]

[tool.uv]
dev-dependencies = []
